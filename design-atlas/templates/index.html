<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="description" content="/*ATLAS_DESCRIPTION*/">
<title>/*ATLAS_TITLE*/</title>
<style>/*ATLAS_CSS*/</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 25 16 5 28 25H4Z M10 15H22 M16 5V25"/></svg></span><div><b>/*ATLAS_BRAND*/</b><span>/*ATLAS_BRAND_SUB*/</span></div></div>
  <nav class="views" aria-label="表示の切り替え">
    /*ATLAS_VIEWS*/
  </nav>
  <div class="top-actions">/*ATLAS_TRACE_BUTTON*/<button id="guide" class="quiet" aria-label="図の読み方と使い方">使い方</button></div>
</header>
<main class="workspace">
  <div class="canvas" id="canvas" tabindex="0" role="region" aria-label="関係図。空白をドラッグ、または矢印キーで移動。拡大縮小ボタンで倍率変更">
    <div id="world"><div id="bands"></div><svg id="edges" aria-label="オブジェクト間の関係線"></svg><div id="nodes"></div></div>
    <div class="canvas-top overlay">
      <div class="map-heading"><p id="mode-eyebrow" class="eyebrow">CONNECTED VIEW</p><h1 id="view-title">画面・業務・データの対応</h1><p id="view-description"></p></div>
      <div class="toolbar surface">
        <button id="open-catalog" aria-expanded="false" aria-controls="catalog-panel" title="一覧と検索を開く">☷ <span>一覧・検索</span></button>
        <select id="scenario" aria-label="業務経路で絞り込む" hidden>/*ATLAS_SCENARIOS*/</select>
        <label class="toggle"><input type="checkbox" id="related-only">関連だけ</label><button id="clear" title="選択と検索を解除">解除</button>
        <button id="open-inspector" aria-expanded="false" aria-controls="inspector">詳細 ↗</button>
      </div>
    </div>
    <div class="selection-bar surface overlay" id="selection-bar" hidden><span id="selection-title"></span><button id="focus-selection">選択を中央へ</button><button id="fit-related">関連を見渡す</button></div>
    <div class="empty-state" id="empty" hidden><b>該当する項目がありません</b><span>検索語または経路を変えてください。</span></div>
    <div class="canvas-bottom overlay">
      <div class="bottom-left">
        <div class="zoom-bar surface" aria-label="キャンバス操作"><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-label" title="100%に戻す" aria-label="表示倍率。押すと100%に戻す">100%</button><button id="zoom-in" aria-label="拡大">＋</button><span class="separator"></span><button id="fit" title="全体を表示。細部は拡大して確認">全体</button><button id="readable" title="読みやすい大きさに戻す">読める倍率</button><details class="canvas-options"><summary aria-label="配置と移動の操作">•••</summary><div class="options-menu surface"><b>地図を移動</b><div class="pan-buttons"><button data-pan="left" aria-label="左へ移動">←</button><button data-pan="up" aria-label="上へ移動">↑</button><button data-pan="down" aria-label="下へ移動">↓</button><button data-pan="right" aria-label="右へ移動">→</button></div><button id="reset-layout">初期配置に戻す</button></div></details></div>
        <div class="canvas-hint">ドラッグで移動 · ⌘/Ctrl＋スクロールで拡大 · ⠿ で配置</div>
      </div>
      <div class="minimap-wrap surface"><div><button id="toggle-map" aria-expanded="true" aria-controls="minimap" aria-label="全体マップを折りたたむ">MAP ▾</button><button id="map-fit" title="全体を表示">全体を見る ↗</button></div><svg id="minimap" tabindex="0" role="button" aria-label="全体地図。クリックした場所へ移動。矢印キーでも移動"></svg></div>
    </div>
  </div>
  <footer class="workspace-foot"><span id="visible-count"></span><button id="edge-guide" class="legend" title="線の強さの判断基準を見る"><span><i class="strong"></i>強い</span><span><i class="normal"></i>参照・依存</span><span><i class="weak"></i>補助・候補</span><span class="legend-help">線の意味 ⓘ</span></button><span id="canvas-caption" class="draft-note"></span></footer>
</main>
<aside class="sidebar panel" id="catalog-panel" aria-label="一覧と検索" hidden>
  <div class="panel-head"><b>一覧から移動</b><button id="close-catalog" aria-label="一覧を閉じる">×</button></div>
  <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="画面・データ・業務を検索" aria-label="画面・データ・業務を検索"><kbd>/</kbd></label>
  <div class="side-title">業務から探す</div><div id="group-list" class="group-list"></div>
  <div class="side-title">項目 <span id="catalog-count"></span></div><div id="catalog" class="catalog"></div>
</aside>
<aside class="inspector panel" id="inspector" aria-label="選択した項目の詳細" hidden><div class="panel-head"><b>つながりの詳細</b><button id="close-inspector" aria-label="詳細を閉じる">×</button></div><div id="details"></div></aside>
<dialog id="viewer" class="viewer" aria-labelledby="viewer-title"><header><div><p id="viewer-caption" class="eyebrow"></p><h2 id="viewer-title"></h2></div><button id="viewer-close" class="quiet" aria-label="閉じる">閉じる ×</button></header><div id="viewer-tabs"></div><div id="viewer-content"></div></dialog>
<div id="live" class="sr-only" aria-live="polite"></div>
<script id="atlas-data" type="application/json">/*ATLAS_DATA*/</script>
<script>/*ATLAS_JS*/</script>
</body></html>
